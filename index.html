<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كنيسة الشهيد مارجرجس</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

  body {
    background: #000;
    color: #fff;
    font-family: 'Cairo', sans-serif;
    margin: 0;
    padding: 40px 20px;
    text-align: center;
    background-image:
      radial-gradient(circle at 30% 30%, rgba(255, 68, 68, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(255, 68, 68, 0.1) 0%, transparent 50%);
  }

.container {
    max-width: 600px;
    margin: 0 auto;
  }

  h1 {
    color: #ff4444;
    font-size: 32px;
    font-weight: 900;
    text-shadow: 0 0 15px #ff4444, 0 0 30px #ff4444;
    margin-bottom: 40px;
    animation: glow 2s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { text-shadow: 0 0 15px #ff4444, 0 0 30px #ff4444; }
    50% { text-shadow: 0 0 25px #ff4444, 0 0 45px #ff4444; }
  }

.card {
    background: rgba(20, 20, 20, 0.8);
    border: 1px solid #ff4444;
    border-radius: 15px;
    padding: 30px;
    margin-bottom: 20px;
    box-shadow: 0 0 25px rgba(255, 68, 68, 0.3);
    transition: all 0.3s ease;
  }

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 35px rgba(255, 68, 68, 0.6);
  }

.card h2 {
    color: #ff4444;
    margin-top: 0;
    font-size: 24px;
  }

.card p {
    color: #ccc;
    font-size: 16px;
    line-height: 1.7;
  }

 .btn {
    display: inline-block;
    background: linear-gradient(135deg, #ff4444, #b71c1c);
    color: white;
    text-decoration: none;
    padding: 15px 40px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 700;
    margin-top: 15px;
    box-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
    transition: all 0.3s ease;
  }

 .btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 35px rgba(255, 68, 68, 0.8);
  }
</style>
</head>
<body>
<div class="container">
  <h1>كنيسة الشهيد مارجرجس</h1>

  <div class="card">
    <h2>📖 مسابقة الكتاب المقدس</h2>
    <p>اختبر معلوماتك في الكتاب المقدس بأسئلة قوية وتعلم مع كل إجابة</p>
    <a href="bible-quiz.html" class="btn">ابدأ المسابقة</a>
  </div>

  <div class="card">
    <h2>📅 مواعيد القداسات</h2>
    <p>شوف مواعيد القداسات والخدمات الأسبوع ده</p>
    <a href="#" class="btn">شاهد المواعيد</a>
  </div>

  <div class="card">
    <h2>🙏 طلبات الصلاة</h2>
    <p>اطلب صلاة أو شارك شكرك مع شعب الكنيسة</p>
    <a href="#" class="btn">اطلب صلاة</a>
  </div>
</div>
</body>
</html>
