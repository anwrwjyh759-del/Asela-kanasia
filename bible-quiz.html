<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسابقة أبو سيفين</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
  body {
    background: #000;
    color: #fff;
    font-family: 'Cairo', sans-serif;
    margin: 0;
    padding: 40px 20px;
    text-align: center;
    background-image:
      radial-gradient(circle at 30% 30%, rgba(255, 68, 68, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(255, 68, 68, 0.1) 0%, transparent 50%);
  }
.box {
    background: rgba(20, 20, 20, 0.9);
    border: 1px solid #ff4444;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(255, 68, 68, 0.3);
    max-width: 600px;
    margin: 0 auto;
  }
  h2 {
    color: #ff4444;
    margin-bottom: 20px;
    line-height: 1.6;
  }
.power {
    background: linear-gradient(135deg, #ff4444, #b71c1c);
    color: white;
    padding: 12px;
    border-radius: 12px;
    text-align: center;
    font-weight: 900;
    margin-bottom: 15px;
    box-shadow: 0 0 20px rgba(255, 68, 68, 0.6);
  }
  #timer {
    font-size: 32px;
    color: #ff4444;
    font-weight: 900;
    text-align: center;
    margin: 15px 0;
    display: none;
    text-shadow: 0 0 15px #ff4444;
  }
  #timer.warning {
    color: #ffeb3b;
    text-shadow: 0 0 20px #ffeb3b;
    animation: blink 0.5s infinite;
  }
  @keyframes blink {
    50% { opacity: 0.5; }
  }
  button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: 1px solid #ff4444;
    border-radius: 12px;
    background: rgba(255, 68, 68, 0.1);
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
    font-family: 'Cairo', sans-serif;
  }
  button:hover:not(:disabled) {
    background: rgba(255, 68, 68, 0.3);
    transform: translateX(-5px);
  }
  button:disabled {
    cursor: not-allowed;
    opacity: 0.6;
  }
  #exp {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    display: none;
    line-height: 1.8;
  }
.correct {
    background: rgba(46, 213, 115, 0.2);
    border: 1px solid #2ed573;
    color: #2ed573;
  }
.wrong {
    background: rgba(255, 71, 87, 0.2);
    border: 1px solid #ff4757;
    color: #ff4757;
  }
.info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    color: #ccc;
    font-size: 16px;
  }
  #nextBtn {
    background: linear-gradient(135deg, #ff4444, #b71c1c);
    color: white;
    border: none;
    display: none;
    font-weight: 700;
  }
  #result {
    text-align: center;
    display: none;
  }
  #result h1 {
    color: #ff4444;
    text-shadow: 0 0 15px #ff4444;
  }
</style>
</head>
<body>

<div class="box">
  <div id="quiz">
    <div class="info">
      <span>السؤال <span id="num">1</span>/20</span>
      <span>النتيجة: <span id="score">0</span></span>
    </div>

    <div id="powerTitle"></div>
    <div id="timer">⏱️ 30 ثانية</div>
    <h2 id="q"></h2>
    <div id="opts"></div>
    <div id="exp"></div>
    <button id="nextBtn" onclick="nextQ()">السؤال التالي ➡️</button>
  </div>

  <div id="result">
    <h1>خلصت! 🎉</h1>
    <h2>نتيجتك: <span id="finalScore"></span>/20</h2>
    <p id="msg"></p>
    <button onclick="restart()">إعادة 🔄</button>
  </div>
</div>

<script>
let data = [];
let i = 0;
let score = 0;
let timer;
let answered = false;

// يجيب الأسئلة من quiz.json
fetch('quiz.json')
.then(res => res.json())
.then(json => {
  data = json;
  showQ();
});

function showQ() {
  clearInterval(timer);
  answered = false;
  document.getElementById("exp").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("timer").style.display = "none";
  document.getElementById("timer").classList.remove("warning");
  document.getElementById("num").innerText = i + 1;
  document.getElementById("score").innerText = score;
  document.getElementById("q").innerText = data[i].question;
  document.getElementById("powerTitle").innerHTML = "";

  // المؤقت يشتغل بس على السؤال 20
  if(i == 19) {
    document.getElementById("powerTitle").innerHTML = '<div class="power">⚡ السؤال الطاقة - 30 ثانية فقط ⚡</div>';
    document.getElementById("timer").style.display = "block";
    let sec = 30;
    document.getElementById("timer").innerText = "⏱️ " + sec + " ثانية";
    timer = setInterval(() => {
      sec--;
      document.getElementById("timer").innerText = "⏱️ " + sec + " ثانية";
      if(sec <= 10) {
        document.getElementById("timer").classList.add("warning");
      }
      if(sec < 0) {
        clearInterval(timer);
        if(!answered) check(-1);
      }
    }, 1000);
  }

  let opts = "";
  data[i].options.forEach((opt, idx) => {
    opts += `<button onclick="check(${idx})">${opt}</button>`;
  });
  document.getElementById("opts").innerHTML = opts;
}

function check(idx) {
  if(answered) return;
  answered = true;
  clearInterval(timer);

  let buttons = document.querySelectorAll("#opts button");
  buttons.forEach(btn => btn.disabled = true);

  let exp = document.getElementById("exp");
  exp.style.display = "block";

  if(idx == data[i].answer) {
    score++;
    exp.className = "correct";
    exp.innerText = "صح ✅\n" + data[i].explanation;
  } else if(idx == -1) {
    exp.className = "wrong";
    exp.innerText = "انتهى الوقت! ❌\n" + data[i].explanation;
  } else {
    exp.className = "wrong";
    exp.innerText = "غلط ❌\nالإجابة الصح: " + data[i].options[data[i].answer] + "\n" + data[i].explanation;
  }

  buttons[data[i].answer].style.background = "rgba(46, 213, 115, 0.4)";

  document.getElementById("nextBtn").style.display = "block";
}

function nextQ() {
  i++;
  if(i < data.length) {
    showQ();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("result").style.display = "block";
  document.getElementById("finalScore").innerText = score;

  let msg = "";
  if(score >= 18) msg = "ممتاز! أنت وحش كتاب مقدس 🔥";
  else if(score >= 14) msg = "كويس جداً! معلوماتك قوية 💪";
  else if(score >= 10) msg = "مستوى متوسط، شد حيلك شوية 📚";
  else msg = "محتاج تقرأ أكتر، بس عاش إنك كملت ❤️";

  document.getElementById("msg").innerText = msg;
}

function restart() {
  i = 0;
  score = 0;
  document.getElementById("quiz").style.display = "block";
  document.getElementById("result").style.display = "none";
  showQ();
}
</script>
</body>
</html>
